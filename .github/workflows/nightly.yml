name: Nightly installer

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish publication before another run can replace the same release/tag.
concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Installing Inno Setup failed' }

      - name: Check boot calculations and lifecycle
        run: |
          dotnet run --project tests/Rigsight.BootChecks -c Release
          if ($LASTEXITCODE) { throw 'Boot checks failed' }

      - name: Build the Debug reference for release checks
        run: |
          dotnet build src/Rigsight.Core -c Debug -o "$env:RUNNER_TEMP/debug-core"
          if ($LASTEXITCODE) { throw 'Debug reference build failed' }

      - name: Build installer and language packs
        run: ./tools/build-installer.ps1

      - name: Check published dependencies and release configuration
        run: ./tools/check-release.ps1 -Publish ./publish -DebugCore "$env:RUNNER_TEMP/debug-core/Rigsight.Core.dll"

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem ./dist/Rigsight-Setup-*.exe, ./dist/Rigsight-Language-*.json -File)
          if (-not ($assets | Where-Object Extension -eq '.exe')) { throw 'No installer was produced' }
          $notes = @"
          Automatic Windows x64 build of main at $env:GITHUB_SHA.
          Download the Rigsight-Setup installer below; .NET and boot trace processing dependencies are included.
          This prerelease is replaced after successful builds on main. Real boot/reboot acceptance testing is not performed by this workflow.
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP nightly-notes.md
          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          gh release view nightly
          if ($LASTEXITCODE -eq 0) {
            gh release delete nightly --yes --cleanup-tag
            if ($LASTEXITCODE) { throw 'Could not remove the previous nightly release' }
          }
          gh release create nightly @($assets.FullName) --target $env:GITHUB_SHA --title nightly --prerelease --latest=false --notes-file $notesPath
          if ($LASTEXITCODE) { throw 'Publishing the nightly release failed' }
